!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrative Task Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #333;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .form,
        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input,
        select,
        button {
            padding: 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input {
            width: 35%;
        }

        select {
            width: 20%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat h2 {
            margin: 5px 0;
            color: #2563eb;
        }

        .task {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .priority {
            font-weight: bold;
        }

        .high {
            color: #dc2626;
        }

        .medium {
            color: #d97706;
        }

        .low {
            color: #16a34a;
        }

        .complete-btn {
            background: #16a34a;
        }

        .delete-btn {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 8px;
            color: #777;
        }

        @media (max-width: 700px) {

            input,
            select {
                width: 100%;
            }

            .stats {
                flex-direction: column;
            }

            .task {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Administrative Task Tracker</h1>
    <p>Organise daily administrative tasks efficiently</p>
</header>

<div class="container">

    <!-- ADD TASK -->
    <div class="form">

        <h2>Add New Task</h2>

        <input
            type="text"
            id="taskInput"
            placeholder="Enter administrative task"
        >

        <select id="priority">
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
        </select>

        <input type="date" id="deadline">

        <button onclick="addTask()">Add Task</button>

    </div>

    <!-- STATISTICS -->
    <div class="stats">

    <div class="stat">
        <p>Total Tasks</p>
        <h2 id="total">0</h2>
    </div>

    <div class="stat">
        <p>Completed</p>
        <h2 id="completed">0</h2>
    </div>

    <div class="stat">
        <p>Pending</p>
        <h2 id="pending">0</h2>
    </div>

    <div class="stat">
        <p>Overdue</p>
        <h2 id="overdue">0</h2>
    </div>

</div>

<div class="form">

    <h2>Task Progress</h2>

    <p>
        Completion:
        <strong id="completionPercentage">0%</strong>
    </p>

    <div style="
        width: 100%;
        background: #e5e7eb;
        border-radius: 10px;
        overflow: hidden;
        height: 20px;
    ">

        <div
            id="progressBar"
            style="
                width: 0%;
                height: 100%;
                background: #2563eb;
                transition: width 0.3s;
            ">
        </div>

    </div>

</div>

    <!-- SEARCH AND FILTER -->
    <div class="filters">

        <h2>Search & Filter</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            oninput="displayTasks()"
        >

        <select id="filterPriority" onchange="displayTasks()">

            <option value="All">All Priorities</option>
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>

        </select>

    </div>

    <h2>Task List</h2>

    <div id="taskList"></div>

</div>

<script>

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    // ADD TASK
    function addTask() {

        const taskInput =
            document.getElementById("taskInput");

        const priority =
            document.getElementById("priority");

        const deadline =
            document.getElementById("deadline");

        if (taskInput.value.trim() === "") {

            alert("Please enter a task.");

            return;
        }

        const task = {

            id: Date.now(),

            name: taskInput.value,

            priority: priority.value,

            deadline: deadline.value,

            completed: false

        };

        tasks.push(task);

        saveTasks();

        taskInput.value = "";

        deadline.value = "";

        displayTasks();

    }


    // COMPLETE TASK
    function completeTask(id) {

        tasks = tasks.map(task => {

            if (task.id === id) {

                task.completed = !task.completed;

            }

            return task;

        });

        saveTasks();

        displayTasks();

    }


    // DELETE TASK
    function deleteTask(id) {

        tasks = tasks.filter(task => task.id !== id);

        saveTasks();

        displayTasks();

    }


    // SAVE TASKS
    function saveTasks() {

        localStorage.setItem(
            "tasks",
            JSON.stringify(tasks)
        );

    }
// DEADLINE STATUS
function getDeadlineStatus(deadline) {

    if (!deadline) {
        return "No deadline";
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const dueDate = new Date(deadline + "T00:00:00");
    dueDate.setHours(0, 0, 0, 0);

    const difference =
        Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));

    if (difference < 0) {
        return `🔴 OVERDUE — ${deadline}`;
    }

    if (difference === 0) {
        return `🟠 DUE TODAY — ${deadline}`;
    }

    if (difference === 1) {
        return `🟡 DUE TOMORROW — ${deadline}`;
    }

    return `🟢 UPCOMING — ${deadline}`;
}

    // DISPLAY TASKS
    function displayTasks() {

        const taskList =
            document.getElementById("taskList");

        const search =
            document.getElementById("searchInput")
            .value
            .toLowerCase();

        const filter =
            document.getElementById("filterPriority")
            .value;


        const filteredTasks = tasks.filter(task => {

            const matchesSearch =
                task.name
                .toLowerCase()
                .includes(search);

            const matchesPriority =
                filter === "All" ||
                task.priority === filter;

            return matchesSearch && matchesPriority;

        });


        taskList.innerHTML = "";


        if (filteredTasks.length === 0) {

            taskList.innerHTML = `
                <div class="empty">
                    No tasks found.
                </div>
            `;

        }


        filteredTasks.forEach(task => {

            const taskDiv =
                document.createElement("div");


            taskDiv.className =
                task.completed
                ? "task completed"
                : "task";


            taskDiv.innerHTML = `

                <div>

                    <strong>${task.name}</strong>

                    <br>

                    <span class="priority ${task.priority.toLowerCase()}">

                        ${task.priority} Priority

                    </span>

                    <br>

                    <small>
    Deadline:
    ${getDeadlineStatus(task.deadline)}
</small>

                       

                </div>


                <div>

                    <button
                        class="complete-btn"
                        onclick="completeTask(${task.id})">

                        ${task.completed
                            ? "Undo"
                            : "Complete"}

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})">

                        Delete

                    </button>

                </div>

            `;


            taskList.appendChild(taskDiv);

        });


        // UPDATE STATISTICS

        document.getElementById("total")
            .textContent = tasks.length;


        const completedTasks =
            tasks.filter(task => task.completed).length;


        document.getElementById("completed")
            .textContent = completedTasks;


        document.getElementById("pending")
            .textContent =
            tasks.length - completedTasks;
// OVERDUE TASKS

const today = new Date();

today.setHours(0, 0, 0, 0);

const overdueTasks = tasks.filter(task => {

    if (!task.deadline || task.completed) {
        return false;
    }

    const dueDate =
        new Date(task.deadline + "T00:00:00");

    dueDate.setHours(0, 0, 0, 0);

    return dueDate < today;

});

document.getElementById("overdue")
    .textContent = overdueTasks.length;


// COMPLETION PERCENTAGE

const percentage = tasks.length === 0
    ? 0
    : Math.round(
        (completedTasks / tasks.length) * 100
      );

document.getElementById("completionPercentage")
    .textContent = percentage + "%";


// PROGRESS BAR

document.getElementById("progressBar")
    .style.width = percentage + "%";
    }


    // LOAD TASKS
    displayTasks();

</script>

</body>
</html>
